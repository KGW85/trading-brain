name: Trading Brain Lagecheck

# GitHub startet geplante Auftraege oft mit Verspaetung. Darum schauen wir
# stuendlich nach - das Programm rechnet aber nur in Kilians Zeitfenstern
# (morgens 8:30-9:30, mittags 14-15, abends 20-21 Uhr deutscher Zeit).
on:
  schedule:
    - cron: "5 * * * *"
  push:
    paths:
      - "trading_brain.py"
      - ".github/workflows/lagecheck.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lagecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests anthropic

      - name: Lagecheck ausfuehren
        env:
          TZ: Europe/Berlin
          TRADING_BRAIN_ONLINE: "1"
          NUR_FENSTER: ${{ github.event_name == 'schedule' && '1' || '0' }}
          NTFY_KANAL: ${{ secrets.NTFY_KANAL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python trading_brain.py

      - name: Ergebnis speichern
        run: |
          git config user.name "Trading Brain"
          git config user.email "actions@github.com"
          git add dashboard.html brain_status.json letzter_lauf.json
          git diff --staged --quiet || git commit -m "Lagecheck"
          git pull --rebase || true
          git push

      - name: Seite vorbereiten
        run: |
          mkdir -p _site
          cp dashboard.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  veroeffentlichen:
    needs: lagecheck
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Trading Brain veroeffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Seite vorbereiten
        run: |
          mkdir -p _site
          cp dashboard.html _site/index.html
          [ -f logo.png ] && cp logo.png _site/ || true
          [ -d stimmen ] && cp -r stimmen _site/ || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Auf GitHub Pages veroeffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
